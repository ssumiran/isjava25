spring.application.name=${SPRING_APP_NAME:sec}
server.port = 9190

#Active prod when it is on-profile by default application.properties
spring.config.activate.on-profile= prod

spring.datasource.url=jdbc:mysql://localhost:3306/isjav25sec
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:ERROR}
logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %yellow(%-5level) %red([%thread]) %blue(%logger{15}) - %msg%n}

